


<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071018">
<title>جنگل زمستانی | علیرضا</title>

<style>
* { box-sizing: border-box; }

:root {
  --brightness: .82;
  --fog: .38;
}

body {
  margin: 0;
  background: #071018;
  color: white;
  font-family: Tahoma, Arial, sans-serif;
  overflow: hidden;
}

#forest {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(var(--brightness));
  z-index: 0;
}

.shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(3,10,17,.35), transparent 35%, rgba(2,8,15,.3)),
    linear-gradient(to right, rgba(0,0,0,.18), transparent 50%);
}

.moonlight {
  position: fixed;
  width: 55vw;
  height: 55vw;
  max-width: 550px;
  max-height: 550px;
  border-radius: 50%;
  top: -25%;
  left: 15%;
  background: radial-gradient(circle, rgba(190,220,255,.13), transparent 70%);
  filter: blur(25px);
  z-index: 1;
  pointer-events: none;
}

.fog {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: var(--fog);
  background: linear-gradient(110deg, transparent 10%, rgba(210,225,240,.10) 45%, transparent 75%);
  filter: blur(28px);
  animation: fogMove 24s ease-in-out infinite alternate;
}

.fog.two {
  opacity: var(--fog);
  animation-duration: 34s;
  animation-direction: alternate-reverse;
  filter: blur(38px);
  background: linear-gradient(70deg, transparent 15%, rgba(220,230,245,.12) 55%, transparent 85%);
}

@keyframes fogMove {
  from { transform: translateX(-12%) scale(1.1); }
  to { transform: translateX(12%) scale(1.3); }
}

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
}

.content {
  position: fixed;
  inset: 0;
  z-index: 4;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 25px;
  pointer-events: none;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.title {
  font-size: clamp(19px, 4vw, 29px);
  font-weight: 300;
  letter-spacing: 1px;
  text-shadow: 0 2px 15px #000;
}

.subtitle {
  color: #d0dce8;
  font-size: 11px;
  margin-top: 8px;
  opacity: .8;
}

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  flex-wrap: wrap;
}

.counter {
  background: rgba(10,20,30,.55);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 14px;
  padding: 12px 16px;
  backdrop-filter: blur(12px);
  font-size: 12px;
}

.counter strong {
  display: block;
  font-size: 22px;
  margin-top: 5px;
  font-weight: normal;
}

.credit {
  font-size: 13px;
  color: #e2eaf2;
  text-shadow: 0 2px 10px black;
}

.controls {
  display: flex;
  gap: 9px;
  align-items: center;
  pointer-events: auto;
}

button {
  font-family: inherit;
  color: white;
  cursor: pointer;
}

.round-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(15,27,39,.75);
  border: 1px solid rgba(255,255,255,.2);
  backdrop-filter: blur(12px);
  font-size: 19px;
}

.round-btn:hover {
  background: rgba(100,140,180,.45);
}

.panel {
  position: fixed;
  z-index: 10;
  top: 82px;
  right: 24px;
  width: min(285px, calc(100vw - 48px));
  max-height: calc(100vh - 110px);
  overflow-y: auto;
  padding: 18px;
  border-radius: 18px;
  background: rgba(8,19,30,.92);
  border: 1px solid rgba(255,255,255,.16);
  backdrop-filter: blur(18px);
  box-shadow: 0 15px 45px rgba(0,0,0,.35);
  display: none;
}

.panel.open { display: block; }

.panel h3 {
  font-size: 15px;
  font-weight: normal;
  margin: 0 0 18px;
}

.setting { margin: 16px 0; }

.setting label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #dce7f1;
  margin-bottom: 9px;
}

input[type="range"] {
  width: 100%;
  accent-color: #b9d5ef;
  cursor: pointer;
}

.share-btn {
  border: 1px solid rgba(255,255,255,.25);
  background: rgba(130,160,190,.18);
  border-radius: 10px;
  padding: 10px 15px;
  font-size: 12px;
  margin-top: 8px;
  width: 100%;
}

.status {
  font-size: 10px;
  color: #b9c8d8;
  margin-top: 10px;
  line-height: 1.8;
}

@media(max-width:600px) {
  .content { padding: 17px; }
  .panel { top: 72px; right: 17px; }
  .title { font-size: 20px; }
  .counter { padding: 9px 12px; }
}
</style>
</head>

<body>

<video id="forest" autoplay muted loop playsinline preload="auto">
  <source src="https://res.cloudinary.com/ztk4cuw7/video/upload/winter.mp4" type="video/mp4">
</video>

<div class="shade"></div>
<div class="moonlight"></div>
<div class="fog"></div>
<div class="fog two"></div>
<canvas id="snow"></canvas>

<div class="content">
  <div class="top">
    <div>
      <div class="title">جنگل زمستانی</div>
      <div class="subtitle">آرامش در سکوت برف...</div>
    </div>

    <div class="controls">
      <button class="round-btn" id="soundBtn">🔇</button>
      <button class="round-btn" id="settingsBtn">⚙</button>
    </div>
  </div>

  <div class="bottom">
    <div class="counter">
      بازدیدهای ثبت‌شده
      <strong id="visitCount">...</strong>
      <div id="counterStatus" class="status">در حال اتصال...</div>
    </div>
    <div class="credit">طراحی و اجرا: علیرضا</div>
  </div>
</div>

<div class="panel" id="settingsPanel">
  <h3>تنظیمات محیط جنگل</h3>

  <div class="setting">
    <label><span>روشنایی</span><span id="brightnessValue">82٪</span></label>
    <input id="brightness" type="range" min="30" max="120" value="82">
  </div>

  <div class="setting">
    <label><span>تراکم بارش برف</span><span id="snowValue">50٪</span></label>
    <input id="snowIntensity" type="range" min="0" max="100" value="50">
  </div>

  <div class="setting">
    <label><span>سرعت سقوط برف</span><span id="speedValue">50٪</span></label>
    <input id="snowSpeed" type="range" min="0" max="100" value="50">
  </div>

  <div class="setting">
    <label><span>شدت باد</span><span id="windValue">25٪</span></label>
    <input id="windIntensity" type="range" min="0" max="100" value="25">
  </div>

  <div class="setting">
    <label><span>شدت مه</span><span id="fogValue">38٪</span></label>
    <input id="fogIntensity" type="range" min="0" max="100" value="38">
  </div>

  <div class="setting">
    <label><span>حجم صدای ویدئو</span><span id="volumeValue">70٪</span></label>
    <input id="volume" type="range" min="0" max="100" value="70">
  </div>

  <button class="share-btn" id="shareBtn">ارسال و اشتراک‌گذاری</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// اتصال به Supabase
const SUPABASE_URL = "https://qpdscmywgthkgubvdnbd.supabase.co";
const SUPABASE_KEY = "sb_publishable_GKebNXKoOtVbQiaPV1E6FA_x8T6Fjjb";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function updateVisits() {
  const count = document.getElementById("visitCount");
  const status = document.getElementById("counterStatus");

  try {
    const { data, error } = await db.rpc("increment_site_visits");

    if (error) throw error;

    count.textContent = Number(data).toLocaleString("fa-IR");
    status.textContent = "بازدید با موفقیت ثبت شد";
  } catch (error) {
    console.error("Counter error:", error);
    count.textContent = "—";
    status.textContent = "اتصال شمارنده ناموفق بود";
  }
}

updateVisits();

// صدا و ویدئو
const video = document.getElementById("forest");
const soundBtn = document.getElementById("soundBtn");
const volumeSlider = document.getElementById("volume");

video.volume = 0.7;

soundBtn.addEventListener("click", () => {
  video.muted = !video.muted;
  soundBtn.textContent = video.muted ? "🔇" : "🔊";
});

volumeSlider.addEventListener("input", () => {
  video.volume = Number(volumeSlider.value) / 100;

  document.getElementById("volumeValue").textContent =
    volumeSlider.value + "٪";

  if (video.volume > 0 && video.muted) {
    video.muted = false;
    soundBtn.textContent = "🔊";
  }
});

// پنل تنظیمات
const panel = document.getElementById("settingsPanel");

document.getElementById("settingsBtn").addEventListener("click", () => {
  panel.classList.toggle("open");
});

// روشنایی
document.getElementById("brightness").addEventListener("input", (e) => {
  const value = Number(e.target.value);
  document.documentElement.style.setProperty("--brightness", value / 100);
  document.getElementById("brightnessValue").textContent = value + "٪";
});

// مه
document.getElementById("fogIntensity").addEventListener("input", (e) => {
  const value = Number(e.target.value);
  document.documentElement.style.setProperty("--fog", value / 100);
  document.getElementById("fogValue").textContent = value + "٪";
});

// اشتراک‌گذاری
document.getElementById("shareBtn").addEventListener("click", async () => {
  const shareData = {
    title: "جنگل زمستانی",
    text: "یک قدم به آرامش زمستانی...",
    url: location.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(location.href);
      alert("آدرس صفحه کپی شد.");
    } else {
      alert("اشتراک‌گذاری در این مرورگر پشتیبانی نمی‌شود.");
    }
  } catch (error) {
    console.log("اشتراک‌گذاری لغو شد.");
  }
});

// سیستم برف و باد
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let flakes = [];

let snowLevel = 50;
let snowSpeed = 50;
let windLevel = 25;

// حداکثر تعداد دانه‌های برف
const MAX_FLAKES = 900;

// مقدار واقعی باد که به‌آرامی به مقدار انتخابی نزدیک می‌شود
let currentWind = 0;

// تنظیم اندازه صفحه
function resizeSnow() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  flakes = [];

  for (let i = 0; i < MAX_FLAKES; i++) {
    flakes.push(createFlake(true));
  }
}

// ساخت دانه برف
function createFlake(randomY = false) {
  return {
    x: Math.random() * width,
    y: randomY ? Math.random() * height : -10,
    radius: Math.random() * 2.5 + .5,
    baseSpeed: Math.random() * 1.2 + .5,
    drift: Math.random() * .8 - .4,
    opacity: Math.random() * .6 + .3,

    // هر دانه حرکت نامنظم مخصوص خودش را دارد
    phase: Math.random() * Math.PI * 2
  };
}

// رسم برف
function drawSnow(timestamp = 0) {
  ctx.clearRect(0, 0, width, height);

  // تراکم برف
  const visibleCount = Math.floor(
    MAX_FLAKES * snowLevel / 100
  );

  // سرعت سقوط مستقل از تراکم
  const speedMultiplier = 0.15 + snowSpeed / 35;

  // باد به‌صورت تدریجی تغییر می‌کند
  const targetWind = windLevel / 100;

  currentWind += (targetWind - currentWind) * 0.025;

  // نوسان طبیعی باد
  const gust = 0.75 + 0.25 * Math.sin(timestamp * 0.0007);

  for (let i = 0; i < visibleCount; i++) {
    const f = flakes[i];

    // رسم دانه برف
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(245,250,255,${f.opacity})`;
    ctx.fill();

    // حرکت عمودی برف
    f.y += f.baseSpeed * speedMultiplier;

    // حرکت افقی طبیعی ناشی از باد
    const personalDrift =
      Math.sin(timestamp * 0.001 + f.phase) * 0.12;

    const windForce =
      currentWind *
      (0.35 + f.radius * 0.22) *
      gust;

    f.x += (
      f.drift * speedMultiplier +
      windForce +
      personalDrift * currentWind
    );

    // بازگرداندن دانه‌های خارج‌شده از پایین صفحه
    if (f.y > height + 8) {
      f.y = -8;
      f.x = Math.random() * width;
    }

    // عبور دانه‌ها از لبه‌های افقی
    if (f.x > width + 8) f.x = -8;
    if (f.x < -8) f.x = width + 8;
  }

  requestAnimationFrame(drawSnow);
}

// کنترل تراکم برف
document.getElementById("snowIntensity").addEventListener("input", (e) => {
  snowLevel = Number(e.target.value);
  document.getElementById("snowValue").textContent = snowLevel + "٪";
});

// کنترل سرعت سقوط برف
document.getElementById("snowSpeed").addEventListener("input", (e) => {
  snowSpeed = Number(e.target.value);
  document.getElementById("speedValue").textContent = snowSpeed + "٪";
});

// کنترل شدت باد
document.getElementById("windIntensity").addEventListener("input", (e) => {
  windLevel = Number(e.target.value);

  document.getElementById("windValue").textContent =
    windLevel + "٪";
});

// شروع سیستم برف
window.addEventListener("resize", resizeSnow);

resizeSnow();
drawSnow();

// شروع ویدئو
video.play().catch(() => {
  console.log("برای شروع ویدئو تعامل کاربر لازم است.");
});
</script>

</body>
</html>
